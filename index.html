<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintQ2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Aysisiti Printing</h1>
    <p>Fast, easy printing — school-friendly</p>
  </header>

  <main>
    <div id="returnBanner" class="hidden"></div>

    <!-- ===================== Add a print job ===================== -->
    <section id="add-item-section" class="form-section">
      <h2>Add a Print Job</h2>
      <form id="itemForm">
        <label>File:</label>
        <input type="file" id="itemFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required />

        <label>Page count:</label>
        <input type="number" id="itemPages" min="1" required />

        <label>Copies:</label>
        <input type="number" id="itemCopies" min="1" value="1" required />

        <label>Paper size:</label>
        <select id="itemPaperSize">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal (+₱2/sheet)</option>
          <option value="A3">A3 (+₱5/sheet)</option>
        </select>

        <label>Orientation:</label>
        <div class="choice-row">
          <label><input type="radio" name="orientation" value="portrait" checked /> Portrait</label>
          <label><input type="radio" name="orientation" value="landscape" /> Landscape</label>
        </div>

        <label>
          <input type="checkbox" id="itemDuplex" />
          Print back-to-back (duplex)
        </label>

        <div id="side1Row">
          <label id="side1Label">Color:</label>
          <div class="choice-row">
            <label><input type="radio" name="side1" value="bw" checked /> Black &amp; White (₱5/page)</label>
            <label><input type="radio" name="side1" value="color" /> Colored (₱10/page)</label>
          </div>
        </div>

        <div id="side2Row" class="hidden">
          <label>Back side color:</label>
          <div class="choice-row">
            <label><input type="radio" name="side2" value="bw" checked /> Black &amp; White</label>
            <label><input type="radio" name="side2" value="color" /> Colored</label>
          </div>
        </div>

        <p id="itemPricePreview" class="price-preview"></p>

        <button type="button" id="addItemBtn">Add to Cart</button>
      </form>
    </section>

    <!-- ===================== Cart ===================== -->
    <section id="cart-section" class="form-section">
      <h2>Your Cart</h2>
      <ul id="cartList" class="cart-list"></ul>
      <p id="cartEmptyMsg" class="muted">No print jobs added yet.</p>
      <p id="cartTotal" class="cart-total hidden"></p>
    </section>

    <!-- ===================== Checkout ===================== -->
    <section id="checkout-section" class="form-section">
      <h2>Checkout</h2>
      <form id="checkoutForm">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Your name" required />

        <label>Phone:</label>
        <input type="tel" id="phone" placeholder="0917xxxxxxx" required />

        <label>Fulfillment:</label>
        <div class="choice-row">
          <label><input type="radio" name="fulfill" value="pickup" checked /> For Pickup</label>
          <label><input type="radio" name="fulfill" value="delivery" /> For Delivery (+₱20)</label>
        </div>

        <div id="locationRow" class="hidden">
          <label>Delivery Location:</label>
          <input type="text" id="location" placeholder="Enter delivery address" />
        </div>

        <button type="button" id="checkoutBtn" disabled>Place Order &amp; Pay</button>
      </form>
      <p id="checkoutStatus" class="status-msg"></p>
    </section>

    <!-- ===================== Status check ===================== -->
    <section id="status-section" class="form-section">
      <h2>Check Print Status</h2>
      <input type="text" id="statusPrintId" placeholder="Enter your Print ID (e.g. ORD-0001)" />
      <button id="checkStatusBtn">Check Status</button>
      <div id="statusResult"></div>
    </section>

    <details id="debugDetails">
      <summary>Debug log</summary>
      <pre id="debugOutput"></pre>
    </details>
  </main>

  <footer>
    <p>© 2026 Aysisiti Printing — Easy School Printing</p>
  </footer>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
